    function getAllSchools() {
      try {
        const raw = localStorage.getItem("dp_custom_schools");
        const custom = raw ? JSON.parse(raw) : [];
        return [...OFFICIAL_SA_SCHOOLS, ...custom];
      } catch {
        return OFFICIAL_SA_SCHOOLS;
      }
    }

    function searchSchools(query = "", province = "All", onlySecondary = true, maxResults = 80) {
      const q = query.trim().toLowerCase();
      const all = getAllSchools();
      const hasQ = q.length > 0;
      const hasProv = province !== "All";
      
      const results = [];
      let totalMatches = 0;

      for (let i = 0; i < all.length; i++) {
        const s = all[i];
        if (onlySecondary && !s.hasGrade10_12) continue;
        if (hasProv && s.province !== province) continue;

        if (hasQ) {
          const match =
            s.schoolName.toLowerCase().includes(q) ||
            s.emis.toLowerCase().includes(q) ||
            s.examCentreNumber.toLowerCase().includes(q) ||
            s.district.toLowerCase().includes(q);
          if (!match) continue;
        }

        totalMatches++;
        if (results.length < maxResults) {
          results.push(s);
        }
      }

      results.totalMatches = totalMatches;
      return results;
    }

    function registerPrincipalSchool(school) {
      if (!school.emis || school.emis.length < 8) return { success: false, message: "EMIS number must be at least 8 digits." };
      if (!school.examCentreNumber || school.examCentreNumber.length < 8) return { success: false, message: "Exam centre number must be valid." };
      try {
        const raw = localStorage.getItem("dp_custom_schools");
        const list = raw ? JSON.parse(raw) : [];
        list.push({ ...school, isPrincipalRegistered: true, hasGrade10_12: true });
        localStorage.setItem("dp_custom_schools", JSON.stringify(list));
        return { success: true, message: `School "${school.schoolName}" successfully added!` };
      } catch {
        return { success: false, message: "Storage error occurred." };
      }
    }

        try {
          const r = localStorage.getItem(`dp_attendance_${centre}_${date}`);
          return r ? JSON.parse(r) : null;
        } catch { return null; }
      },

        localStorage.setItem(`dp_attendance_${centre}_${date}`, JSON.stringify(att));

        try {
          const r = localStorage.getItem(`dp_tasks_${centre}`);
          return r ? JSON.parse(r) : [];
        } catch { return []; }
      },
      saveTask: (centre, task) => {
        const list = STORAGE.getTasks(centre);
        const idx = list.findIndex(t => t.id === task.id);
        if (idx >= 0) list[idx] = task; else list.unshift(task);
        localStorage.setItem(`dp_tasks_${centre}`, JSON.stringify(list));
      },

      getAnnouncements: (centre) => {
        try {

          const cutoff = new Date();
          cutoff.setDate(cutoff.getDate() - 90);

              <div>
                <span className="px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px] font-bold uppercase tracking-wider border border-emerald-500/30">DBE National Examinations</span>
                <h3 className="text-lg font-black text-white mt-1">DBE Past Matric Papers & Memos</h3>

                <a href="https://www.education.gov.za/Curriculum/Grade-12-Past-Exam-papers" target="_blank" rel="noreferrer" className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow">

                        <span className="px-2 py-0.5 rounded bg-slate-800 text-emerald-400 font-bold text-[10px] uppercase">{res.type}</span>

    /* ============================================================
       4. STAFF VIEW (Can Edit)
       ============================================================ */
    function StaffView({ user, onLogout }) {
      const [tab, setTab] = useState("attendance");
      const [learners, setLearners] = useState([]);
      const [date, setDate] = useState(new Date().toISOString().split("T")[0]);
      const [grade, setGrade] = useState("10");
      const [attendance, setAttendance] = useState(null);
      const [saveNotice, setSaveNotice] = useState("");

      // Roster form
      const [rName, setRName] = useState("");
      const [rAdm, setRAdm] = useState("");
      const [rGrade, setRGrade] = useState("10");
      const [rClass, setRClass] = useState("10A");
      const [rPhone, setRPhone] = useState("");

      // Tasks
      const [tasks, setTasks] = useState([]);
      const [tSub, setTSub] = useState("Mathematics");
      const [tTitle, setTTitle] = useState("");
      const [tDue, setTDue] = useState(new Date(Date.now() + 7 * 86400000).toISOString().split("T")[0]);
      const [tGrade, setTGrade] = useState("10");
      const [selectedTaskId, setSelectedTaskId] = useState(null);

      // Exams
      const [exams, setExams] = useState([]);
      const [exSub, setExSub] = useState("Mathematics");
      const [exPaper, setExPaper] = useState("Paper 1");
      const [exDate, setExDate] = useState(new Date(Date.now() + 14 * 86400000).toISOString().split("T")[0]);
      const [exTime, setExTime] = useState("09:00");
      const [exDur, setExDur] = useState("3 Hours");
      const [exVenue, setExVenue] = useState("Main Hall");
      const [exGrade, setExGrade] = useState("12");

      // Announcements
      const [announcements, setAnnouncements] = useState([]);
      const [aTitle, setATitle] = useState("");
      const [aContent, setAContent] = useState("");
      const [aUrgent, setAUrgent] = useState(false);

      // Resources
      const [resType, setResType] = useState("textbook");
      const [resTitle, setResTitle] = useState("");
      const [resSub, setResSub] = useState("Mathematics");
      const [resGrade, setResGrade] = useState("12");
      const [resUrl, setResUrl] = useState("");

      const loadData = () => {
        setLearners(STORAGE.getLearners(user.examCentreNumber));
        setTasks(STORAGE.getTasks(user.examCentreNumber));
        setExams(STORAGE.getExams(user.examCentreNumber));
        setAnnouncements(STORAGE.getAnnouncements(user.examCentreNumber));
        setAttendance(STORAGE.getAttendance(user.examCentreNumber, date));
      };

      useEffect(() => {
        loadData();
      }, [user.examCentreNumber, date]);

      const filteredLearners = learners.filter(l => l.grade === grade);

      const toggleAtt = (learnerId) => {
        const records = { ...(attendance?.records || {}) };
        const current = records[learnerId]?.status || "present";
        let next = "present";
        if (current === "present") next = "absent";
        else if (current === "absent") next = "late";
        else next = "present";

        records[learnerId] = { status: next, timestamp: new Date().toISOString() };
        const updated = {
          date,
          examCentreNumber: user.examCentreNumber,
          grade,
          records,
          markedBy: user.staffName,
          updatedAt: new Date().toISOString()
        };
        STORAGE.saveAttendance(user.examCentreNumber, date, updated);
        setAttendance(updated);
        setSaveNotice("Attendance recorded!");
        setTimeout(() => setSaveNotice(""), 1500);
      };

      const markAllPresent = () => {
        const records = { ...(attendance?.records || {}) };
        filteredLearners.forEach(l => {
          records[l.id] = { status: "present", timestamp: new Date().toISOString() };
        });
        const updated = {
          date,
          examCentreNumber: user.examCentreNumber,
          grade,
          records,
          markedBy: user.staffName,
          updatedAt: new Date().toISOString()
        };
        STORAGE.saveAttendance(user.examCentreNumber, date, updated);
        setAttendance(updated);
        setSaveNotice(`All ${filteredLearners.length} learners marked present!`);
        setTimeout(() => setSaveNotice(""), 2000);
      };

      const handleAddLearner = (e) => {
        e.preventDefault();
        if (!rName || !rAdm) return;
        STORAGE.saveLearner(user.examCentreNumber, {
          id: "lrn_" + Date.now(),
          examCentreNumber: user.examCentreNumber,
          fullName: rName.trim(),
          admissionNo: rAdm.trim(),
          grade: rGrade,
          classGroup: rClass.trim().toUpperCase(),
          parentPhone: rPhone.trim() || undefined,
          enrolledAt: new Date().toISOString()
        });
        setRName("");
        setRAdm("");
        setRPhone("");
        loadData();
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!tTitle || !tSub) return;
        STORAGE.saveTask(user.examCentreNumber, {
          id: "task_" + Date.now(),
          examCentreNumber: user.examCentreNumber,
          grade: tGrade,
          subject: tSub.trim(),
          title: tTitle.trim(),
          dueDate: tDue,
          createdAt: new Date().toISOString(),
          createdBy: user.staffName,
          submissions: {}
        });
        setTTitle("");
        loadData();
      };

      const toggleSubmission = (taskId, learnerId, currentStatus) => {
        const target = tasks.find(t => t.id === taskId);
        if (target) {
          if (!target.submissions) target.submissions = {};
          target.submissions[learnerId] = currentStatus === "submitted" ? "not_submitted" : "submitted";
          STORAGE.saveTask(user.examCentreNumber, target);
          loadData();
        }
      };

      const handleAddExam = (e) => {
        e.preventDefault();
        STORAGE.saveExam(user.examCentreNumber, {
          id: "exam_" + Date.now(),
          examCentreNumber: user.examCentreNumber,
          grade: exGrade,
          subject: exSub,
          paperName: exPaper,
          date: exDate,
          startTime: exTime,
          duration: exDur,
          venue: exVenue
        });
        setExPaper("");
        loadData();
      };

      const handleAddAnnouncement = (e) => {
        e.preventDefault();
        if (!aTitle || !aContent) return;
        STORAGE.saveAnnouncement(user.examCentreNumber, {
          id: "ann_" + Date.now(),
          examCentreNumber: user.examCentreNumber,
          schoolName: user.schoolName,
          title: aTitle.trim(),
          content: aContent.trim(),
          targetGrade: "all",
          isUrgent: aUrgent,
          authorName: user.staffName,
          createdAt: new Date().toISOString()
        });
        setATitle("");
        setAContent("");
        setAUrgent(false);
        loadData();
      };

      const handleAddResource = (e) => {
        e.preventDefault();
        if (!resTitle || !resUrl) return;
        STORAGE.saveResource(user.examCentreNumber, {
          id: "res_" + Date.now(),
          examCentreNumber: user.examCentreNumber,
          type: resType,
          title: resTitle.trim(),
          subject: resSub.trim(),
          grade: resGrade,
          fileDataOrUrl: resUrl.trim(),
          fileName: resTitle.trim(),
          uploadedAt: new Date().toISOString(),
          uploadedBy: user.staffName
        });
        setResTitle("");
        setResUrl("");
        loadData();
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header with Always-Visible Logout */}
          <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 shadow">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center font-black text-white text-base">
                  DP
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-sm md:text-base text-white truncate max-w-xs">{user.schoolName}</h1>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-bold px-2 py-0.5 rounded border border-emerald-500/30">STAFF</span>
                  </div>
                  <div className="text-[11px] text-slate-400">
                    Centre: <strong className="text-slate-300 font-mono">{user.examCentreNumber}</strong> • {user.staffName} ({user.staffRole})
                  </div>
                </div>
              </div>
              <button
                onClick={onLogout}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-red-950/40 hover:bg-red-900/60 border border-red-800/60 text-red-300 text-xs font-bold transition-all"
              >
                Log Out ↪
              </button>
            </div>
          </header>

          {/* Navigation Bar */}
          <nav className="bg-slate-900 border-b border-slate-800 px-4">
            <div className="max-w-6xl mx-auto flex overflow-x-auto no-scrollbar gap-2 py-2">
              {[
                { id: "attendance", label: "📋 Daily Attendance" },
                { id: "roster", label: `👥 Learner Roster (${learners.length})` },
                { id: "tasks", label: "📝 Tasks & Submissions" },
                { id: "exams", label: "📅 Exam Timetable" },
                { id: "announcements", label: "📢 Announcements" },
                { id: "resources", label: "📚 eLibrary & Resources" }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                    tab === t.id ? "bg-emerald-600 text-white shadow" : "text-slate-400 hover:text-white hover:bg-slate-800"
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </nav>

          <main className="max-w-6xl mx-auto w-full flex-1 p-4 md:p-6 space-y-6">
            {/* TAB: ATTENDANCE */}
            {tab === "attendance" && (
              <div className="space-y-4 animate-fadeIn">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div className="flex flex-wrap items-center gap-3">
                    <div>
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Date</span>

                    </div>
                    <div>
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Grade</span>
                      <select
                        value={grade}
                        onChange={e => setGrade(e.target.value)}
                        className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white font-bold"

                        <option value="10">Grade 10</option>
                        <option value="11">Grade 11</option>
                        <option value="12">Grade 12</option>

                  </div>

                  <div className="flex items-center gap-3">
                    {saveNotice && <span className="text-xs text-emerald-400 font-semibold animate-pulse">✓ {saveNotice}</span>}
                    {filteredLearners.length > 0 && (
                      <button

                        ⚡ Mark All Present
                      </button>
                    )}
                  </div>
                </div>

                <div className="flex items-center gap-4 text-xs text-slate-400">
                  <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-emerald-500"></span> Present</span>
                  <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-red-500"></span> Absent (Triggers Alert)</span>
                  <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-amber-500"></span> Late</span>
                </div>

                {filteredLearners.length === 0 ? (
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-3">
                    <div className="text-3xl">👥</div>
                    <h3 className="text-base font-bold text-white">No Grade {grade} Learners Enrolled Yet</h3>
                    <p className="text-xs text-slate-400 max-w-sm mx-auto">
                      Empty DB Rule: No mock learners exist. Enroll your Grade 10-12 class roster in the Roster tab.

                    <button onClick={() => setTab("roster")} className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    {filteredLearners.map(l => {
                      const rec = attendance?.records?.[l.id];
                      const st = rec?.status || "absent";
                      return (
                        <div

                          onClick={() => toggleAtt(l.id)}

                            st === "present"
                              ? "bg-emerald-950/30 border-emerald-600/60"
                              : st === "absent"
                              ? "bg-red-950/40 border-red-600/70"
                              : "bg-amber-950/30 border-amber-600/60"

                            <div className="font-bold text-sm text-white">{l.fullName}</div>
                            <div className="text-[11px] text-slate-400">{l.classGroup} • Adm: {l.admissionNo}</div>

                            {st === "late" && <span className="px-3 py-1 rounded-xl bg-amber-600 text-white font-bold text-xs">⏳ LATE</span>}
                          </div>
                        </div>
                      );
                    })}
                  </div>

              </div>

                          required
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-xs font-bold text-slate-300">Admission No / EMIS Identifier</label>
                        <input
                          type="text"
                          value={rAdm}
                          onChange={e => setRAdm(e.target.value)}
                          placeholder="e.g. ADM2026-402"
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                          required
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div className="space-y-1">
                          <label className="text-xs font-bold text-slate-300">Grade</label>
                          <select
                            value={rGrade}
                            onChange={e => setRGrade(e.target.value)}
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold"
                          >
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                          </select>
                        </div>
                        <div className="space-y-1">
                          <label className="text-xs font-bold text-slate-300">Class</label>
                          <input
                            type="text"
                            value={rClass}
                            onChange={e => setRClass(e.target.value)}

                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                            required
                          />

                      <div className="space-y-1">
                        <label className="text-xs font-bold text-slate-300">Parent Phone</label>
                        <input

                          value={rPhone}

                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"

                          onChange={e => setTTitle(e.target.value)}

                <div className="space-y-3">
                  {tasks.length === 0 ? (
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center text-xs text-slate-400">

                    tasks.map(t => {
                      const gLearners = learners.filter(l => l.grade === t.grade);
                      const subCount = Object.values(t.submissions || {}).filter(s => s === "submitted").length;
                      return (
                        <div key={t.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">

                          </div>

                          <button
                            onClick={() => setSelectedTaskId(selectedTaskId === t.id ? null : t.id)}
                            className="text-xs font-bold text-emerald-400 hover:text-emerald-300"
                          >

                          </button>

                          {selectedTaskId === t.id && (
                            <div className="bg-slate-850 p-3 rounded-xl border border-slate-750 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 mt-2">
                              {gLearners.map(l => {
                                const isSub = t.submissions?.[l.id] === "submitted";
                                return (
                                  <button
                                    key={l.id}
                                    onClick={() => toggleSubmission(t.id, l.id, isSub ? "submitted" : "not_submitted")}
                                    className={`p-2 rounded-xl border text-left flex items-center justify-between text-xs transition-all ${
                                      isSub ? "bg-emerald-950/40 border-emerald-600/70 text-white" : "bg-red-950/30 border-red-700/60 text-slate-200"
                                    }`}

                                      <div className="font-bold">{l.fullName}</div>

            {/* TAB: EXAMS */}
            {tab === "exams" && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-4">

                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Grade</label>
                        <select value={exGrade} onChange={e => setExGrade(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold">

                      <div>

                      <div>

                        <input type="time" value={exTime} onChange={e => setExTime(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Duration</label>
                        <input type="text" value={exDur} onChange={e => setExDur(e.target.value)} placeholder="3 Hours" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Venue</label>
                        <input type="text" value={exVenue} onChange={e => setExVenue(e.target.value)} placeholder="Hall" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                      </div>
                    </div>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600 font-bold text-xs text-white shadow">
                      + Add to Exam Schedule
                    </button>
                  </form>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-3">
                  <h3 className="text-base font-bold text-white">Exam Timetable ({exams.length})</h3>
                  {exams.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-400">No exams scheduled yet.</div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="border-b border-slate-800 text-slate-400 uppercase text-[10px]">
                            <th className="p-2">Date</th>
                            <th className="p-2">Grade</th>
                            <th className="p-2">Subject</th>
                            <th className="p-2">Time</th>
                            <th className="p-2">Venue</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {exams.map(e => (
                            <tr key={e.id} className="hover:bg-slate-800/40">
                              <td className="p-2 font-mono font-bold text-white">{e.date}</td>
                              <td className="p-2 text-blue-400 font-bold">Grade {e.grade}</td>
                              <td className="p-2"><span className="text-emerald-400 font-bold">{e.subject}</span> ({e.paperName})</td>
                              <td className="p-2">{e.startTime} ({e.duration})</td>
                              <td className="p-2 text-slate-400">{e.venue}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB: ANNOUNCEMENTS */}
            {tab === "announcements" && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <span>📢</span> Post Circular / Announcement
                  </h3>
                  <form onSubmit={handleAddAnnouncement} className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Title</label>
                      <input
                        type="text"
                        value={aTitle}
                        onChange={e => setATitle(e.target.value)}
                        placeholder="e.g. Saturday Extra Classes for Grade 12"
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Content</label>
                      <textarea
                        rows="3"
                        value={aContent}
                        onChange={e => setAContent(e.target.value)}
                        placeholder="Details..."
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                        required
                      />
                    </div>
                    <div className="flex items-center gap-2">
                      <input
                        type="checkbox"
                        id="urg"
                        checked={aUrgent}
                        onChange={e => setAUrgent(e.target.checked)}
                        className="w-4 h-4 text-red-600 rounded"
                      />
                      <label htmlFor="urg" className="text-xs font-bold text-red-400">Mark as URGENT (Displays red alert banner)</label>
                    </div>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600 font-bold text-xs text-white shadow">
                      Publish Circular
                    </button>
                  </form>
                </div>

                <div className="space-y-3">
                  {announcements.map(a => (
                    <div key={a.id} className={`p-4 rounded-2xl border ${a.isUrgent ? "border-red-600 bg-red-950/20" : "border-slate-800 bg-slate-900"}`}>
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          {a.isUrgent && <span className="px-2 py-0.5 rounded bg-red-600 text-white font-black text-[10px]">URGENT</span>}
                          <h4 className="font-bold text-white text-sm">{a.title}</h4>
                        </div>
                        <span className="text-[11px] text-slate-400 font-mono">{new Date(a.createdAt).toLocaleDateString()}</span>
                      </div>
                      <p className="text-xs text-slate-300 mt-2 whitespace-pre-wrap">{a.content}</p>
                      <div className="text-[10px] text-slate-500 mt-2 pt-2 border-t border-slate-800">Posted by: {a.authorName}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: RESOURCES */}
            {tab === "resources" && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-4">
                  <h3 className="text-base font-bold text-white">Upload to School Library</h3>
                  {/* Upload type buttons as requested */}
                  <div className="flex gap-2">
                    {["textbook", "pdf", "notes"].map(t => (
                      <button
                        key={t}
                        type="button"
                        onClick={() => setResType(t)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold uppercase ${
                          resType === t ? "bg-emerald-600 text-white" : "bg-slate-800 text-slate-400"
                        }`}
                      >
                        Upload {t}
                      </button>
                    ))}
                  </div>

                  <form onSubmit={handleAddResource} className="space-y-3">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Title</label>
                        <input type="text" value={resTitle} onChange={e => setResTitle(e.target.value)} placeholder="e.g. Mind the Gap Physics" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Subject</label>
                        <input type="text" value={resSub} onChange={e => setResSub(e.target.value)} placeholder="Physical Sciences" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Grade</label>
                        <select value={resGrade} onChange={e => setResGrade(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold">
                          <option value="12">Grade 12</option>
                          <option value="11">Grade 11</option>
                          <option value="10">Grade 10</option>
                        </select>
                      </div>

                      <label className="text-xs font-bold text-slate-300 block mb-1">Document URL / Cloud Link</label>
                      <input type="url" value={resUrl} onChange={e => setResUrl(e.target.value)} placeholder="https://..." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />

                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600 font-bold text-xs text-white shadow">
                      Save to School Library
                    </button>
                  </form>
                </div>

                <ELibraryView examCentreNumber={user.examCentreNumber} userGrade="All" />

            )}
          </main>
        </div>
      );
    }

    /* ============================================================
       5. PARENT / LEARNER VIEW (Read-Only)
       ============================================================ */
    function StudentOrParentView({ user, onLogout }) {
      const [tab, setTab] = useState("overview");
      const isParent = user.role === "parent";
      const todayStr = new Date().toISOString().split("T")[0];

      const learners = useMemo(() => STORAGE.getLearners(user.examCentreNumber), [user.examCentreNumber]);
      const matched = learners.find(l => l.admissionNo.toLowerCase() === user.learnerAdmissionNo.toLowerCase() || l.fullName.toLowerCase() === user.learnerFullName.toLowerCase());
      const learnerGrade = user.grade || matched?.grade || "10";

      const todayAtt = useMemo(() => STORAGE.getAttendance(user.examCentreNumber, todayStr), [user.examCentreNumber, todayStr]);
      const todayStatus = matched && todayAtt?.records?.[matched.id] ? todayAtt.records[matched.id].status : "not_recorded";
      const isBunkingToday = todayStatus === "absent";

      // 14 days history
      const history = useMemo(() => {
        if (!matched) return [];
        const res = [];
        const t = new Date();
        for (let i = 0; i < 14; i++) {
          const d = new Date(t);
          d.setDate(t.getDate() - i);
          const k = d.toISOString().split("T")[0];
          const rec = STORAGE.getAttendance(user.examCentreNumber, k);
          if (rec && rec.records[matched.id]) {
            res.push({ date: k, status: rec.records[matched.id].status });
          }
        }
        return res;
      }, [matched, user.examCentreNumber]);

      const attRate = history.length > 0 ? Math.round((history.filter(h => h.status === "present").length / history.length) * 100) : 100;

      // Tasks
      const tasks = useMemo(() => STORAGE.getTasks(user.examCentreNumber).filter(t => t.grade === learnerGrade), [user.examCentreNumber, learnerGrade]);
      const subCount = matched ? tasks.filter(t => t.submissions?.[matched.id] === "submitted").length : 0;
      const taskRate = tasks.length > 0 ? Math.round((subCount / tasks.length) * 100) : 100;

      // Exams & Announcements
      const exams = useMemo(() => STORAGE.getExams(user.examCentreNumber).filter(e => e.grade === learnerGrade), [user.examCentreNumber, learnerGrade]);
      const announcements = useMemo(() => STORAGE.getAnnouncements(user.examCentreNumber), [user.examCentreNumber]);

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header with Always-Visible Logout */}
          <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 shadow">
            <div className="max-w-5xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-black text-white text-base ${isParent ? "bg-amber-600" : "bg-blue-600"}`}>
                  DP
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-sm md:text-base text-white truncate max-w-xs">{user.schoolName}</h1>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${isParent ? "bg-amber-500/20 text-amber-300 border-amber-500/30" : "bg-blue-500/20 text-blue-300 border-blue-500/30"}`}>
                      {isParent ? "PARENT PORTAL" : "LEARNER PORTAL"}
                    </span>
                    <span className="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">READ-ONLY</span>
                  </div>
                  <div className="text-[11px] text-slate-400">
                    Learner: <strong className="text-white">{user.learnerFullName}</strong> • Adm: {user.learnerAdmissionNo}
                  </div>
                </div>
              </div>

              <button
                onClick={onLogout}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-red-950/40 hover:bg-red-900/60 border border-red-800/60 text-red-300 text-xs font-bold transition-all"
              >
                Log Out ↪
              </button>
            </div>
          </header>

          {/* BUNKING ALERT BANNER */}
          {isBunkingToday && (
            <div className="bg-red-950/90 border-b-2 border-red-600 px-4 py-3 text-red-100 animate-pulse shadow-xl">
              <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">🚨</span>
                  <div>
                    <h2 className="font-black text-sm md:text-base text-white tracking-wide">
                      BUNKING ALERT: LEARNER RECORDED ABSENT TODAY ({todayStr})!
                    </h2>
                    <p className="text-xs text-red-200">
                      {user.learnerFullName} was marked ABSENT by educator. Please check with your school immediately.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Nav */}
          <nav className="bg-slate-900 border-b border-slate-800 px-4">
            <div className="max-w-5xl mx-auto flex overflow-x-auto no-scrollbar gap-2 py-2">
              {[
                { id: "overview", label: "📊 Overview" },
                { id: "attendance", label: "📋 Daily Attendance" },
                { id: "tasks", label: "📝 Subject Tasks" },
                { id: "exams", label: "📅 Exam Timetable" },
                { id: "announcements", label: `📢 Announcements (${announcements.length})` },
                { id: "elibrary", label: "📚 eLibrary" },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                    tab === t.id ? (isParent ? "bg-amber-600 text-white" : "bg-blue-600 text-white") : "text-slate-400 hover:text-white hover:bg-slate-800"
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </nav>

          <main className="max-w-5xl mx-auto w-full flex-1 p-4 md:p-6 space-y-6">
            {tab === "overview" && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Grade {learnerGrade} Student Profile</span>
                    <h2 className="text-2xl font-black text-white">{user.learnerFullName}</h2>
                    <div className="text-xs text-slate-400 mt-1">
                      School: {user.schoolName} • Centre: {user.examCentreNumber}
                    </div>
                  </div>

                  <div className="bg-slate-850 border border-slate-750 p-4 rounded-2xl text-center">
                    <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Today's Attendance</span>
                    {todayStatus === "present" && <span className="px-3 py-1 rounded-xl bg-emerald-600 text-white font-bold text-xs">✓ PRESENT</span>}
                    {todayStatus === "absent" && <span className="px-3 py-1 rounded-xl bg-red-600 text-white font-bold text-xs animate-pulse">✕ ABSENT</span>}
                    {todayStatus === "late" && <span className="px-3 py-1 rounded-xl bg-amber-600 text-white font-bold text-xs">⏳ LATE</span>}
                    {todayStatus === "not_recorded" && <span className="text-xs text-slate-500">Pending Roll Call</span>}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-white text-sm">Attendance Discipline</h3>
                      <span className="text-2xl font-black text-emerald-400">{attRate}%</span>
                    </div>
                    <div className="w-full h-3 bg-slate-800 rounded-full overflow-hidden">
                      <div className="h-full bg-emerald-500" style={{ width: `${attRate}%` }}></div>
                    </div>
                    <div className="text-xs text-slate-400">
                      Tracking past 14 recorded school days.
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-white text-sm">Task Submission Discipline</h3>
                      <span className="text-2xl font-black text-emerald-400">{taskRate}%</span>
                    </div>
                    <div className="w-full h-3 bg-slate-800 rounded-full overflow-hidden">
                      <div className="h-full bg-emerald-500" style={{ width: `${taskRate}%` }}></div>
                    </div>
                    <div className="text-xs text-slate-400">
                      {subCount} of {tasks.length} subject tasks completed.
                    </div>
                  </div>
                </div>

                <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 text-xs text-slate-400">
                  🔒 <strong>Tamper-Proof Read-Only Portal:</strong> Parents & learners can view all records. Educators only hold editing privileges.
                </div>
              </div>
            )}

            {tab === "attendance" && (
              <div className="space-y-4 animate-fadeIn">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-3">
                  <h3 className="font-bold text-white text-base">Class Attendance History</h3>
                  {history.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-400">No attendance registered yet by school staff.</div>
                  ) : (
                    history.map((h, i) => (
                      <div key={i} className="p-3 rounded-2xl border border-slate-800 bg-slate-850 flex items-center justify-between">
                        <div className="font-mono text-xs text-slate-300">{h.date}</div>
                        <div>

    /* ============================================================

      const filteredSchools = useMemo(() => searchSchools(schoolQuery, selectedProvince), [schoolQuery, selectedProvince]);

      const handleStaffSubmit = (e) => {
        e.preventDefault();
        setError("");
        const users = STORAGE.getUsers();

        if (mode === "login") {
          const match = users.find(u => u.role === "staff" && u.examCentreNumber === sExam.trim() && u.passwordHash === sPass.trim());
          if (!match) {
            setError("Invalid Exam Centre Number or Password. Sign Up if you are a new school staff member.");
            return;
          }
          STORAGE.setSession(match);
          onLoginSuccess(match);
        } else {
          if (!selectedSchool) {
            setError("Please select your school from the official DBE list.");
            return;
          }
          const newUser = {
            id: "staff_" + Date.now(),
            role: "staff",
            examCentreNumber: selectedSchool.examCentreNumber,
            emis: selectedSchool.emis,
            schoolName: selectedSchool.schoolName,
            province: selectedSchool.province,
            staffName: sName.trim(),
            staffRole: sRole,
            passwordHash: sPass.trim(),
            createdAt: new Date().toISOString()
          };
          STORAGE.saveUser(newUser);
          STORAGE.setSession(newUser);
          onLoginSuccess(newUser);
        }
      };

      const handleParentSubmit = (e) => {
        e.preventDefault();
        setError("");
        if (!selectedSchool) {
          setError("Please select the learner's school.");
          return;
        }

        const users = STORAGE.getUsers();
        if (mode === "login") {
          const match = users.find(u => u.role === "parent" && u.examCentreNumber === selectedSchool.examCentreNumber && u.learnerAdmissionNo.toLowerCase() === pLAdm.trim().toLowerCase() && u.passwordHash === pPass.trim());
          if (!match) {
            setError("Parent account not found for these credentials. Sign Up if you have not created an account.");
            return;
          }
          STORAGE.setSession(match);
          onLoginSuccess(match);
        } else {

            id: "parent_" + Date.now(),
            role: "parent",
            examCentreNumber: selectedSchool.examCentreNumber,
            schoolEmis: selectedSchool.emis,
            schoolName: selectedSchool.schoolName,
            learnerFullName: pLName.trim(),
            learnerAdmissionNo: pLAdm.trim(),

            relationship: "Parent",

          STORAGE.saveUser(newUser);
          STORAGE.setSession(newUser);
          onLoginSuccess(newUser);

                      <div>
                        <div className="font-bold text-white">I am a Learner</div>

                    <span className="text-emerald-400 font-bold text-lg">→</span>

                        type="button"
                        onClick={() => setShowSchools(true)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white text-left flex justify-between items-center"
                      >
                        <span className="truncate">{selectedSchool ? selectedSchool.schoolName : "Select your school..."}</span>
                        <span className="text-xs text-emerald-400 font-bold ml-2">Browse</span>
                      </button>
                    </div>

                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-300">Your Full Names</label>
                      <input
                        type="text"
                        value={lLName}
                        onChange={e => setLLName(e.target.value)}
                        placeholder="e.g. Karabo Dlamini"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                        required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div className="space-y-1">
                        <label className="text-xs font-bold text-slate-300">Admission No</label>
                        <input
                          type="text"
                          value={lLAdm}
                          onChange={e => setLLAdm(e.target.value)}
                          placeholder="e.g. ADM2026-402"
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                          required
                        />
                      </div>
                      {mode === "signup" && (
                        <div className="space-y-1">
                          <label className="text-xs font-bold text-slate-300">Grade</label>
                          <select
                            value={lGrade}
                            onChange={e => setLGrade(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white font-bold"
                          >
                            <option value="10">Grade 10</option>
                            <option value="11">Grade 11</option>
                            <option value="12">Grade 12</option>
                          </select>
                        </div>
                      )}
                    </div>

                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-300">Password</label>
                      <input
                        type="password"
                        value={lPass}
                        onChange={e => setLPass(e.target.value)}
                        placeholder="Enter password"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                        required
                      />
                    </div>

                    <button type="submit" className="w-full py-3 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-500 text-white shadow">
                      {mode === "login" ? "Access Learner Portal →" : "Create Learner Account →"}
                    </button>
                  </form>
                )}

                {(role === "parent" || role === "learner") && (
                  <div className="p-2.5 rounded-xl bg-slate-900 text-[11px] text-slate-400">
                    🔒 READ-ONLY: Only registered school staff can log attendance & mark submissions.
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODAL: REAL SA SCHOOLS LIST */}
          {showSchools && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 animate-fadeIn">
              <div className="bg-slate-850 border border-slate-700 rounded-3xl w-full max-w-xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-slate-700 flex justify-between items-center">
                  <div>
                    <h3 className="font-extrabold text-white text-base">Select Official DBE School</h3>
                    <p className="text-xs text-slate-400">Database verified with DBE EMIS & Exam Centre codes</p>
                  </div>
                  <button onClick={() => setShowSchools(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="p-4 border-b border-slate-700 bg-slate-900 space-y-2">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={schoolQuery}
                      onChange={e => setSchoolQuery(e.target.value)}
                      placeholder="Search school name, EMIS, exam centre..."
                      className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                    />
                    <select
                      value={selectedProvince}
                      onChange={e => setSelectedProvince(e.target.value)}
                      className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold"
                    >
                      <option value="All">All 9 Provinces (50+ Schools Each)</option>
                      {SA_PROVINCES.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                  <div className="p-2 rounded-xl bg-slate-800 text-[11px] text-emerald-300">
                    Schools loaded from DBE EMIS - principal can add missing school with proof of EMIS letter. Never generate fake EMIS.
                  </div>
                  <div className="flex justify-between text-xs text-slate-400">
                    <span>{filteredSchools.length} secondary schools offering Gr 10-12</span>
                    <button onClick={() => { setShowSchools(false); setShowAddSchool(true); }} className="text-emerald-400 underline">
                      Add missing school →
                    </button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-2 divide-y divide-slate-800">
                  {filteredSchools.length === 0 ? (
                    <div className="text-center py-10 space-y-2 text-xs text-slate-400">
                      <div className="text-3xl">🏫</div>
                      <div className="font-bold text-white">No matching DBE school found</div>
                      <p>Schools loaded from DBE EMIS - principal can add missing school with proof of EMIS letter</p>
                      <button onClick={() => { setShowSchools(false); setShowAddSchool(true); }} className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg font-bold">
                        Register Missing School with EMIS Proof
                      </button>
                    </div>
                  ) : (
                    filteredSchools.map(s => (
                    <button
                      key={s.emis}
                      onClick={() => {
                        setSelectedSchool(s);
                        if (role === "staff") setSExam(s.examCentreNumber);
                        setShowSchools(false);
                      }}
                      className="w-full text-left p-3 rounded-xl hover:bg-slate-800 flex justify-between items-start"
                    >
                      <div>
                        <div className="font-bold text-sm text-white">{s.schoolName}</div>
                        <div className="text-xs text-slate-400">📍 {s.district}, {s.province} • Q{s.quintile}</div>
                        <div className="text-[11px] text-slate-500 font-mono">EMIS: {s.emis} • Exam: {s.examCentreNumber}</div>
                      </div>
                      <span className="px-2 py-1 rounded bg-slate-800 text-xs text-emerald-400 font-bold">Select</span>
                    </button>
                  )))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: PRINCIPAL ADD SCHOOL */}
          {showAddSchool && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 animate-fadeIn">
              <div className="bg-slate-850 border border-slate-700 rounded-3xl w-full max-w-lg shadow-2xl p-5 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                  <h3 className="font-bold text-white text-base">Register School with DBE Proof</h3>
                  <button onClick={() => setShowAddSchool(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="p-3 bg-amber-950/40 border border-amber-700 rounded-xl text-xs text-amber-200">
                  ⚠️ Never invent fake EMIS. Principal must confirm official DBE EMIS certificate.
                </div>

                <form onSubmit={handleAddMissingSchool} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">School Name</label>
                    <input type="text" value={addName} onChange={e => setAddName(e.target.value)} placeholder="e.g. Sitintile Secondary" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Province</label>
                      <select value={addProv} onChange={e => setAddProv(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        {SA_PROVINCES.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">District</label>
                      <input type="text" value={addDist} onChange={e => setAddDist(e.target.value)} placeholder="e.g. Ehlanzeni" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">EMIS Number</label>
                      <input type="text" value={addEmis} onChange={e => setAddEmis(e.target.value)} placeholder="8 digits" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Exam Centre Number</label>
                      <input type="text" value={addExam} onChange={e => setAddExam(e.target.value)} placeholder="8-13 digits" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Proof of EMIS Letter Reference</label>
                    <input type="text" value={addRef} onChange={e => setAddRef(e.target.value)} placeholder="e.g. DBE/REF/2026/01" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" required />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowAddSchool(false)} className="flex-1 py-2 rounded-xl border border-slate-700 text-xs text-slate-400">Cancel</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow">Save School</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="text-center text-xs text-slate-500 pt-4">
            Discipline Partners (DP) • South Africa Grade 10-12 Attendance & Academic Portal
          </footer>
        </div>
      );
    }

    /* ============================================================
       7. ROOT APP COMPONENT
       ============================================================ */
    function App() {
      const [currentUser, setCurrentUser] = useState(null);

      useEffect(() => {
        const session = STORAGE.getSession();
        if (session) setCurrentUser(session);
      }, []);

      const handleLogout = () => {
        STORAGE.clearSession();
        setCurrentUser(null);
      };

      if (!currentUser) {
        return <LoginView onLoginSuccess={setCurrentUser} />;
      }

      if (currentUser.role === "staff") {
        return <StaffView user={currentUser} onLogout={handleLogout} />;
      }

      return <StudentOrParentView user={currentUser} onLogout={handleLogout} />;
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
